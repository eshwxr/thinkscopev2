[project]
name = "thinkscope"
version = "0.1.0"
description = "Autonomous multi-agent research intelligence RAG system (Planner -> Retrieval -> Critic loop with citation verification)"
requires-python = ">=3.13"
dependencies = [
    "arxiv>=4.0.0",
    "chromadb>=1.5.9",
    "fastapi>=0.139.0",
    "groq>=1.5.0",
    "huggingface-hub>=1.23.0",
    "langgraph>=1.2.9",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.0",
    "uvicorn[standard]>=0.51.0",
]
